<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="/css/productos.css">
</head>
<body>

<header class="header">
    <a href="/catalogo.html" class="header-back">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/>
        </svg>
    </a>
    <span class="header-title">Detalles del Producto</span>
    <a href="/carrito.html" class="header-cart">

<div class="product-image-wrap">
    <img src="/img/images.jpg" alt="Camisa blanca hombre">
</div>

    <div class="product-name">Camisa blanca hombre</div>
    <div class="product-price">COP 60.000</div>
    <div class="product-desc">
        Camisa blanca para hombre, ideal para un estilo cómodo y moderno.
    </div>

    <div class="section-label">Cantidad</div>
    <div class="qty-row">
        <button class="qty-btn">−</button>
        <span class="qty-display">1</span>
        <button class="qty-btn">+</button>

    <a href="/carrito.html" class="add-to-cart">Agregar al carrito</a>

<div class="related-section">

    <div class="related-grid">

        <a href="/productos/detalle-cepillo.html" class="related-card">
            <img src="/img/2_RVmhnONZEpUKK2nWaC4.jpg" alt="Cepillo de dientes">

                <div class="related-card-name">Cepillo de dientes</div>
